<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =====================================================
   BODY
===================================================== */

body {

    min-height: 100vh;

    overflow: hidden;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 15px;

    font-family:
        "Courier New",
        monospace;

    background-color: #21162f;

    /* Pixel stars */

    background-image:

        radial-gradient(
            circle,
            #ffd7e8 2px,
            transparent 2px
        );

    background-size: 70px 70px;

}


/* =====================================================
   MAIN WINDOW
===================================================== */

.window {

    width: 100%;

    max-width: 510px;

    background: #fff3f8;

    border: 6px solid #151515;

    padding: 7px;

    box-shadow:
        10px 10px 0 #000;

    position: relative;

    z-index: 10;

    animation: windowIn 0.7s steps(5);

}


@keyframes windowIn {

    from {

        transform: scale(0.6);

        opacity: 0;

    }

    to {

        transform: scale(1);

        opacity: 1;

    }

}


/* =====================================================
   TITLE BAR
===================================================== */

.titlebar {

    height: 48px;

    background: #ff6fa8;

    border: 4px solid #111;

    color: white;

    padding: 8px 10px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    font-size: 14px;

    font-weight: bold;

}


.window-buttons {

    display: flex;

    gap: 5px;

}


.window-button {

    width: 11px;

    height: 11px;

    background: #fff;

    border: 2px solid #111;

}


/* =====================================================
   MESSAGE BOX
===================================================== */

.message {

    background: #ffffff;

    border: 4px solid #111;

    margin-top: 12px;

    padding: 15px 10px 20px;

    text-align: center;

}


/* =====================================================
   CAT AREA
===================================================== */

.cat-area {

    height: 190px;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

}


/* =====================================================
   PIXEL CAT
===================================================== */

.pixel-cat {

    width: 190px;

    height: 175px;

    image-rendering: pixelated;

    shape-rendering: crispEdges;

    overflow: visible;

    animation: catIdle 2s steps(2) infinite;

}


/* Normal breathing */

@keyframes catIdle {

    0%,
    100% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(-4px);

    }

}


/* Happy jumping */

.pixel-cat.happy {

    animation:
        happyJump 0.45s steps(2) infinite alternate;

}


@keyframes happyJump {

    from {

        transform:
            translateY(0)
            rotate(-2deg);

    }

    to {

        transform:
            translateY(-14px)
            rotate(2deg);

    }

}


/* Sad shaking */

.pixel-cat.sad {

    animation:
        sadShake 0.35s steps(2) infinite;

}


@keyframes sadShake {

    0% {

        transform:
            translateX(0);

    }

    25% {

        transform:
            translateX(-5px);

    }

    50% {

        transform:
            translateX(0);

    }

    75% {

        transform:
            translateX(5px);

    }

    100% {

        transform:
            translateX(0);

    }

}


/* =====================================================
   PIXEL EYES
===================================================== */

.eye {

    transition: 0.1s;

}


/* Blink */

.pixel-cat.blink .eye {

    opacity: 0;

}


/* Happy eyes */

.pixel-cat.happy .eye {

    opacity: 0;

}


.happy-eye {

    opacity: 0;

}


.pixel-cat.happy .happy-eye {

    opacity: 1;

}


/* Sad eyes */

.sad-eye {

    opacity: 0;

}


.pixel-cat.sad .sad-eye {

    opacity: 1;

}


.pixel-cat.sad .normal-eye {

    opacity: 0;

}


/* =====================================================
   MOUTH
===================================================== */

.happy-mouth {

    opacity: 0;

}


.pixel-cat.happy .happy-mouth {

    opacity: 1;

}


.normal-mouth {

    opacity: 1;

}


.pixel-cat.happy .normal-mouth {

    opacity: 0;

}


.sad-mouth {

    opacity: 0;

}


.pixel-cat.sad .sad-mouth {

    opacity: 1;

}


.pixel-cat.sad .normal-mouth {

    opacity: 0;

}


/* =====================================================
   TEARS
===================================================== */

.tear {

    opacity: 0;

}


.pixel-cat.sad .tear {

    opacity: 1;

    animation:
        pixelTear 0.8s steps(4) infinite;

}


@keyframes pixelTear {

    0% {

        transform:
            translateY(0);

        opacity: 1;

    }

    100% {

        transform:
            translateY(24px);

        opacity: 0;

    }

}


/* =====================================================
   HEART
===================================================== */

.held-heart {

    animation:
        heartBeat 1s steps(2) infinite;

    transform-origin:
        center;

}


@keyframes heartBeat {

    0%,
    100% {

        transform:
            scale(1);

    }

    50% {

        transform:
            scale(1.12);

    }

}


/* Hide heart when sad */

.pixel-cat.sad .held-heart {

    display: none;

}


/* Show broken heart */

.broken-heart {

    display: none;

}


.pixel-cat.sad .broken-heart {

    display: block;

}

   QUESTION
===================================================== */

.subtext {

/* =====================================================
   BUTTONS
===================================================== */

button {

#no {

/* =====================================================

===================================================== */

        opacity: 0;

    }

    to {

        transform:
            scale(1);

        opacity: 1;

    }

}


/* =====================================================
   KISS
===================================================== */

.kiss {

    position: fixed;

    font-size: 24px;

    z-index: 100;

    pointer-events: none;

    image-rendering: pixelated;

    animation:
        kissFly 1.5s steps(8) forwards;

}


@keyframes kissFly {

    0% {

        transform:
            translate(0, 0)
            scale(0.5);

        opacity: 0;

    }

    20% {

        opacity: 1;

    }

    100% {

        transform:
            translate(
                80px,
                -120px
            )
            scale(1.3);

        opacity: 0;

    }

}


/* =====================================================
   CONFETTI
===================================================== */

.confetti {

    position: fixed;

    top: -20px;

    width: 9px;

    height: 9px;

    z-index: 90;

    pointer-events: none;

    animation:
        confettiFall
        2.5s
        steps(12)
        forwards;

}


@keyframes confettiFall {

    0% {

        transform:
            translateY(0)
            rotate(0deg);

        opacity: 1;

    }

    100% {

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;

    }

/* =====================================================
   FLOATING HEARTS
===================================================== */

    z-index: 2;

/* =====================================================
   FOOTER
===================================================== */

/* =====================================================

===================================================== */

        "#ff9fc5",
        "#ffe45e",
        "#65e878",
        "#6ecbff",

        piece.style.left =

        piece.style.background =

        piece.style.animationDelay =
            Math.random() * .4 + "s";


        document.body.appendChild(
            piece
        );


        setTimeout(() => {

            piece.remove();

        }, 5000);

    }

}


/* =====================================================
   KISSES
===================================================== */

function createKisses(amount) {


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        setTimeout(() => {


            const kiss =
                document.createElement("div");


            kiss.className =
                "kiss";


            kiss.innerHTML =
                "💋";


            kiss.style.left =
                (45 + Math.random() * 10)
                + "%";


            kiss.style.top =
                "45%";


            document.body.appendChild(
                kiss
            );


            setTimeout(() => {

                kiss.remove();

            }, 1600);


        }, i * 120);

    }

}


/* =====================================================
   FLOATING HEARTS
===================================================== */

function createHearts(amount) {


    const hearts = [

        "♥",
        "♥",
        "♡",
        "♥"

    ];


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        const heart =
            document.createElement("div");


        heart.className =
            "float-heart";


        heart.innerHTML =
            hearts[
                Math.floor(
                    Math.random() *
                    hearts.length
                )
            ];


        heart.style.color =
            "#ff6fa8";


        heart.style.left =
            Math.random() * 100
            + "vw";


        heart.style.fontSize =
            Math.random() * 15 + 15
            + "px";


        heart.style.animationDuration =
            Math.random() * 3 + 4
            + "s";


        document.body.appendChild(
            heart
        );


        setTimeout(() => {

            heart.remove();

        }, 7000);

    }

}


/* =====================================================
   CONTINUOUS HEARTS
===================================================== */

setInterval(() => {

    createHearts(1);

}, 1500);
